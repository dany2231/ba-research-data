function collabPeriods(){if(collabPeriod==='quarterly')return qs.map(o=>({label:`${o.y} Q${o.q}`,year:o.y,slot:o.q,rows:dated.filter(d=>+d.date.slice(0,4)===o.y&&Math.ceil(+d.date.slice(5,7)/3)===o.q)}));const a=[];for(let y=2021;y<=2026;y++)for(let m=1;m<=12;m++){if(y===2026&&m>9)break;a.push({label:`${y}.${String(m).padStart(2,'0')}`,year:y,slot:m,rows:dated.filter(d=>+d.date.slice(0,4)===y&&+d.date.slice(5,7)===m)})}return a}
function renderCollabView(){const ps=collabPeriods(),vals=ps.map(p=>p.rows.length),top=Math.max(4,Math.ceil(Math.max(...vals)/4)*4),chart=document.querySelector('.chart');chart.classList.toggle('monthly',collabPeriod==='monthly');document.querySelector('section h2').textContent=`${collabPeriod==='monthly'?'월별':'분기별'} ${viewLabel} 콜라보 추이`;yaxis.innerHTML=[top,top*.75,top*.5,top*.25,0].map(n=>`<span>${n}</span>`).join('');plot.innerHTML=ps.map((p,i)=>`<div class="barcol" data-i="${i}"><span class="total" style="bottom:calc(${p.rows.length/top*100}% + 5px)">${p.rows.length||''}</span><div class="bar" style="height:100%">${active.has(viewLabel)&&p.rows.length?`<div class="seg" style="height:${p.rows.length/top*100}%;background:${C[viewLabel]}"></div>`:''}</div></div>`).join('');xlabels.innerHTML=ps.map(p=>`<div class="xlabel">${collabPeriod==='monthly'?(p.slot===1?p.year+'<br>':'<br>')+p.slot+'월':p.year+'<br>Q'+p.slot}</div>`).join('');let levels={};collabEvents.forEach(key=>{const g=collabEventGroups[key];g.monthly.forEach(e=>{let i;if(collabPeriod==='monthly')i=ps.findIndex(p=>p.year===e[1]&&p.slot===e[2]);else i=ps.findIndex(p=>p.year===e[1]&&p.slot===Math.ceil(e[2]/3));if(i<0)return;const level=levels[i]||0;levels[i]=level+1;plot.insertAdjacentHTML('beforeend',`<div class="annomark ${g.cls} level-${Math.min(level,2)}" style="left:${(i+.5)/ps.length*100}%"><b>${e[0]}</b></div>`)})});document.querySelectorAll('.barcol').forEach(el=>{el.onmousemove=e=>{const p=ps[+el.dataset.i];tip(e,`<b>${p.label} · ${p.rows.length}건</b><br>`+p.rows.map(r=>r.name).join('<br>'))};el.onmouseleave=untip})}
document.querySelectorAll('[data-cperiod]').forEach(b=>b.onclick=()=>{collabPeriod=b.dataset.cperiod;document.querySelectorAll('[data-cperiod]').forEach(x=>x.classList.toggle('on',x===b));renderCollabView()});document.querySelectorAll('[data-cevent]').forEach(b=>b.onclick=()=>{collabEvents.has(b.dataset.cevent)?collabEvents.delete(b.dataset.cevent):collabEvents.add(b.dataset.cevent);b.classList.toggle('on');renderCollabView()});document.querySelectorAll('#legend button').forEach(b=>b.onclick=()=>{active.has(viewLabel)?active.delete(viewLabel):active.add(viewLabel);b.classList.toggle('off');renderCollabView()});
document.querySelector('.controlRow .download').onclick=()=>{const ps=collabPeriods(),W=collabPeriod==='monthly'?2800:1800,H=820,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);c.fillStyle='#12213d';c.font='700 36px sans-serif';c.fillText(`${collabPeriod==='monthly'?'월별':'분기별'} ${viewLabel} 콜라보 추이`,60,55);const left=75,right=35,top=125,bottom=100,pw=W-left-right,ph=H-top-bottom,vals=ps.map(p=>p.rows.length),max=Math.max(4,Math.ceil(Math.max(...vals)/4)*4);c.strokeStyle='#dce4f0';for(let i=0;i<=4;i++){const yy=top+ph*i/4;c.beginPath();c.moveTo(left,yy);c.lineTo(W-right,yy);c.stroke();c.fillStyle='#647089';c.font='14px sans-serif';c.textAlign='right';c.fillText(String(max-max*i/4),left-10,yy+4)}const bw=pw/ps.length*.65;ps.forEach((p,i)=>{const x=left+pw*(i+.5)/ps.length-bw/2,h=p.rows.length/max*ph;c.fillStyle=C[viewLabel];c.fillRect(x,top+ph-h,bw,h);if(p.rows.length){c.fillStyle='#12213d';c.textAlign='center';c.font='700 12px sans-serif';c.fillText(String(p.rows.length),x+bw/2,top+ph-h-6)}c.save();c.translate(x+bw/2,H-55);c.rotate(-Math.PI/3);c.fillStyle='#647089';c.font='12px sans-serif';c.textAlign='right';c.fillText(p.label,0,0);c.restore()});const a=document.createElement('a');a.download=`blue-archive-${view}-${collabPeriod}-chart.png`;a.href=canvas.toDataURL('image/png');a.click()};renderCollabView();
</script><script>
collabEventGroups.fes.monthly.forEach((e,i)=>e[0]=`${i+3}주년 FES`);collabEventGroups.live.monthly[1][0]='교토 SP';collabEventGroups.live.monthly[2][0]='3.5 공개';collabEventGroups.live.monthly[3][0]='Summer SP';collabEventGroups.live.monthly[4][0]='4.5 공개';const eventGuide=document.createElement('div');eventGuide.className='eventGuide';eventGuide.innerHTML='<span><i style="background:#9aa9bd"></i>주년·반주년</span><span><i style="background:#855cc7"></i>애니·미디어</span><span><i style="background:#f06d65"></i>주년 FES</span><span><i style="background:#25a7a0"></i>공개방송</span><span><i style="background:#3877c8"></i>메인 스토리</span><span><i style="background:#db8c27"></i>대형 게임 이벤트</span>';controlRow.after(eventGuide);renderCollabView();
</script></body></html>
