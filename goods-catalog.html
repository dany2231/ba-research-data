<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>블루 아카이브 굿즈 카탈로그</title>
  <link rel="stylesheet" href="atlas-layout.css">
  <style>
    :root{--ink:#12213d;--muted:#647089;--line:#dce4f0;--soft:#f5f8fc;--blue:#347fdb;--teal:#25a7a0;--coral:#f06d65;--shadow:0 10px 28px rgba(28,54,90,.07)}
    *{box-sizing:border-box}html{scrollbar-gutter:stable}body{margin:0;color:var(--ink);background:#fff;font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.top h1{margin:0 0 7px;font-size:clamp(30px,3.4vw,48px);letter-spacing:-.045em}.top p{margin:0;color:var(--muted);font-size:13px}.stats{display:flex;gap:9px}.stat{min-width:116px;padding:12px 14px;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px}.stat b{display:block;color:var(--c);font-size:25px}.stat span{color:var(--muted);font-size:10px}.tools{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(5,minmax(125px,.7fr));gap:9px;padding:13px;background:rgba(245,248,252,.96);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(10px)}input,select{width:100%;height:42px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;font-size:12px;outline:0}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,127,219,.12)}.rangeFilter{min-width:0;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:9px}.rangeHead{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;color:var(--muted);font-size:9px}.rangeHead b{color:var(--ink)}.rangeInputs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.rangeInputs input[type=range]{height:20px;padding:0;border:0;box-shadow:none;accent-color:var(--blue)}.resultbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:18px 2px 12px}.resultbar b{font-size:14px}.resultbar span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.card{min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease,border-color .15s ease}.card:hover{transform:translateY(-2px);border-color:#b9cae0}.media{position:relative;aspect-ratio:1;background:var(--soft);overflow:hidden}.media img{width:100%;height:100%;display:block;object-fit:contain}.noimage{height:100%;display:grid;place-items:center;color:#91a0b5;font-size:11px}.source{position:absolute;top:9px;left:9px;padding:5px 7px;color:#fff;background:rgba(18,33,61,.86);border-radius:6px;font-size:9px;font-weight:800}.info{padding:12px}.category{color:var(--blue);font-size:10px;font-weight:800}.name{height:42px;margin:6px 0 10px;overflow:hidden;font-size:13px;line-height:1.55;font-weight:750;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-size:13px;font-weight:850}.date{color:var(--muted);font-size:9px}.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px 0 8px}.pager button,.modal-actions a,.modal-actions button{font:inherit;font-size:11px;font-weight:750;border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-decoration:none;cursor:pointer}.pager button{color:var(--ink);background:#fff}.pager button:disabled{opacity:.35;cursor:default}.pager b{min-width:90px;text-align:center;font-size:11px}dialog{width:min(880px,calc(100vw - 28px));max-height:calc(100vh - 28px);padding:0;border:0;border-radius:16px;box-shadow:0 24px 80px rgba(14,31,59,.28)}dialog::backdrop{background:rgba(14,31,59,.42)}.detail{display:grid;grid-template-columns:minmax(280px,.9fr) 1.1fr}.detail-media{min-height:430px;display:grid;place-items:center;background:var(--soft)}.detail-media img{width:100%;height:100%;max-height:560px;object-fit:contain}.detail-body{padding:28px}.detail-body small{color:var(--blue);font-weight:800}.detail-body h2{margin:9px 0 18px;font-size:24px;line-height:1.35;letter-spacing:-.03em}.detail-price{font-size:24px;font-weight:900}.facts{display:grid;grid-template-columns:90px 1fr;gap:9px 14px;margin:22px 0;color:var(--muted);font-size:12px}.facts b{color:var(--ink)}.modal-actions{display:flex;gap:8px}.modal-actions a{color:#fff;background:var(--ink);border-color:var(--ink)}.modal-actions button{color:var(--ink);background:#fff}.empty{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--muted);background:var(--soft);border-radius:13px}footer{display:flex;justify-content:space-between;gap:16px;margin-top:16px;color:var(--muted);font-size:10px}
    .tools{display:flex;flex-direction:column;gap:14px;padding:18px;background:rgba(245,248,252,.97);box-shadow:0 8px 24px rgba(28,54,90,.04)}.filterTop{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px}.filterGrid{display:grid;grid-template-columns:minmax(150px,.9fr) minmax(220px,1.45fr) minmax(300px,1.35fr) minmax(340px,1.55fr) minmax(160px,.95fr);align-items:end;gap:12px}.field{position:relative;min-width:0;display:flex;flex-direction:column;gap:7px;margin:0;padding:0;border:0}.field>span,.field legend{height:14px;padding:0;color:#52617a;font-size:10px;font-weight:800;line-height:14px}.field legend{display:block;width:100%;margin-bottom:7px}.priceField legend{display:flex;align-items:center;justify-content:space-between;gap:10px}.priceField legend small{color:#7a879b;font-size:9px;font-weight:650;white-space:nowrap}.searchField{min-width:0}.tools input{height:44px;padding:0 13px;border-color:#d7e0ed;border-radius:10px;font-size:12px}.tools input:hover{border-color:#bdcada}.tools input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,127,219,.12)}.resetButton{height:44px;padding:0 16px;color:var(--ink);background:#fff;border:1px solid #d7e0ed;border-radius:10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}.resetButton:hover{background:#eef4fb;border-color:#bdcada}.resetButton:active{transform:translateY(1px)}.rangePair{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);align-items:center;gap:8px}.rangePair>span{color:#8591a5;font-size:12px;text-align:center}.rangePair input{min-width:0;text-align:right;font-variant-numeric:tabular-nums}.priceInput{position:relative;min-width:0}.priceInput input{padding:15px 12px 0 45px;text-align:right}.priceRole{position:absolute;z-index:1;top:6px;left:12px;color:#7a879b;font-size:8px;font-weight:800;line-height:1;pointer-events:none}.currency{position:absolute;z-index:1;left:12px;bottom:8px;color:#52617a;font-size:11px;font-weight:800;pointer-events:none}.nativeSelect{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.selectUi{position:relative;min-width:0}.selectTrigger{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 13px;color:var(--ink);background:#fff;border:1px solid #d7e0ed;border-radius:10px;font:inherit;font-size:12px;text-align:left;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}.selectTrigger:hover{border-color:#bdcada;background:#fdfefe}.selectTrigger:focus-visible,.selectTrigger[aria-expanded=true]{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,127,219,.12)}.selectTrigger svg{width:15px;height:15px;flex:0 0 auto;color:#718099;transition:transform .15s ease}.selectTrigger[aria-expanded=true] svg{transform:rotate(180deg)}.selectMenu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;display:none;max-height:260px;overflow:auto;padding:5px;background:#fff;border:1px solid #d7e0ed;border-radius:11px;box-shadow:0 16px 40px rgba(18,33,61,.16)}.selectUi.open .selectMenu{display:block}.selectOption{width:100%;min-height:36px;display:flex;align-items:center;padding:8px 10px;color:var(--ink);background:transparent;border:0;border-radius:7px;font:inherit;font-size:12px;text-align:left;cursor:pointer}.selectOption:hover,.selectOption:focus-visible{outline:0;background:#eef4fb}.selectOption[aria-selected=true]{color:#236cbf;background:#e8f2ff;font-weight:800}.activeFilters{display:none;align-items:center;gap:7px;flex-wrap:wrap;padding-top:1px}.activeFilters.visible{display:flex}.filterBadge{display:inline-flex;align-items:center;gap:5px;min-height:29px;padding:4px 8px 4px 10px;color:var(--ink);background:#fff;border:1px solid #d7e0ed;border-radius:999px;font-size:10px;font-weight:700}.filterBadge button{width:20px;height:20px;display:grid;place-items:center;padding:0;color:var(--muted);background:transparent;border:0;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}.filterBadge button:hover{color:var(--ink);background:#eef4fb}
    @media(max-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.filterGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.categoryField{grid-column:span 1}}
    @media(max-width:850px){.wrap{padding:20px 15px}.top{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1;min-width:0}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tools{position:static}.detail{grid-template-columns:1fr}.detail-media{min-height:300px}.detail-body{padding:21px}}
    @media(max-width:570px){.top h1{font-size:28px;word-break:keep-all}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:10px 8px}.stat b{font-size:21px}.tools{padding:16px}.filterTop{grid-template-columns:1fr;align-items:stretch}.resetButton{width:100%}.filterGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.info{padding:10px}.name{font-size:12px}.resultbar{align-items:flex-start;flex-direction:column;gap:4px}.detail-body h2{font-size:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><h1>블루 아카이브 굿즈 카탈로그</h1><p>Yostar와 Animate 상품을 검색하고 분류별로 살펴보는 통합 카탈로그</p></div>
      <div class="stats"><div class="stat" style="--c:var(--blue)"><b id="totalStat">0</b><span>전체 상품</span></div></div>
    </header>
    <section class="tools" aria-label="상품 검색과 필터">
      <div class="filterTop"><label class="field searchField"><span>상품 검색</span><input id="search" type="search" placeholder="상품명, 이벤트, 상품 ID 입력"></label><button type="button" class="resetButton" id="resetFilters">필터 초기화</button></div>
      <div class="filterGrid">
        <div class="field"><span>판매처</span><select id="source"><option value="">전체 판매처</option></select></div>
        <div class="field categoryField"><span>카테고리</span><select id="category"><option value="">전체 카테고리</option></select></div>
        <fieldset class="field rangeField"><legend>판매 연도</legend><div class="rangePair"><select id="yearMin" aria-label="최소 판매 연도"></select><span aria-hidden="true">–</span><select id="yearMax" aria-label="최대 판매 연도"></select></div></fieldset>
        <fieldset class="field rangeField priceField"><legend><span>가격</span><small id="priceRangeHint"></small></legend><div class="rangePair"><label class="priceInput"><span class="priceRole">최소 가격</span><span class="currency">¥</span><input id="priceMin" type="number" min="0" step="500" value="0" aria-label="최소 가격"></label><span aria-hidden="true">–</span><label class="priceInput"><span class="priceRole">최대 가격</span><span class="currency">¥</span><input id="priceMax" type="number" min="0" step="500" aria-label="최대 가격"></label></div></fieldset>
        <div class="field"><span>정렬</span><select id="sort"><option value="dateDesc">최신 판매순</option><option value="dateAsc">오래된 판매순</option><option value="priceAsc">낮은 가격순</option><option value="priceDesc">높은 가격순</option><option value="name">상품명순</option></select></div>
      </div>
      <div class="activeFilters" id="activeFilters" aria-live="polite"></div>
    </section>
    <div class="resultbar"><b id="resultCount"></b><span>한 페이지에 40개씩 표시합니다. 카드를 누르면 상세 정보가 열립니다.</span></div>
    <section class="grid" id="catalog" aria-live="polite"></section>
    <nav class="pager" aria-label="페이지 이동"><button id="prev">이전</button><b id="pageInfo"></b><button id="next">다음</button></nav>
    <footer><span>Yostar와 Animate 상품 데이터</span></footer>
  </main>
  <dialog id="detail"><div id="detailContent"></div></dialog>
  <script src="catalog-data.js"></script>
  <script>
    const products=window.CATALOG_PRODUCTS||[],pageSize=40,state={page:1},priceValues=products.map(p=>p.price).filter(Number.isFinite),DATA_PRICE_MIN=Math.min(...priceValues),DATA_PRICE_MAX=Math.max(...priceValues),PRICE_MIN=0,PRICE_MAX=Math.ceil(DATA_PRICE_MAX/500)*500;
    const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const safeUrl=value=>/^https:\/\//i.test(value||'')?value:'#';
    function unique(field){return [...new Set(products.map(p=>p[field]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ko'))}
    function option(select,values){select.insertAdjacentHTML('beforeend',values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''))}
    option($('source'),unique('source'));option($('category'),unique('category'));option($('yearMin'),[2021,2022,2023,2024,2025,2026]);option($('yearMax'),[2021,2022,2023,2024,2025,2026]);$('yearMin').value='2021';$('yearMax').value='2026';
    $('priceMin').max=PRICE_MAX;$('priceMax').max=PRICE_MAX;$('priceMin').value=PRICE_MIN;$('priceMax').value=PRICE_MAX;$('priceRangeHint').textContent=`전체 범위 ¥${DATA_PRICE_MIN.toLocaleString()}–¥${DATA_PRICE_MAX.toLocaleString()}`;
    function enhanceSelect(select){
      const ui=document.createElement('div'),trigger=document.createElement('button'),menu=document.createElement('div'),label=select.getAttribute('aria-label')||select.closest('.field')?.querySelector('span,legend')?.textContent||'옵션';
      ui.className='selectUi';trigger.type='button';trigger.className='selectTrigger';trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');trigger.setAttribute('aria-label',label);menu.className='selectMenu';menu.setAttribute('role','listbox');menu.setAttribute('aria-label',label);
      trigger.innerHTML='<span></span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 7.5 4.5 4.5 4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      [...select.options].forEach(option=>{const item=document.createElement('button');item.type='button';item.className='selectOption';item.setAttribute('role','option');item.dataset.value=option.value;item.textContent=option.textContent;item.onclick=()=>{select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}));closeSelect(ui);trigger.focus()};menu.appendChild(item)});
      ui.append(trigger,menu);select.after(ui);select.classList.add('nativeSelect');select.setAttribute('tabindex','-1');select.setAttribute('aria-hidden','true');
      trigger.onclick=event=>{event.preventDefault();const willOpen=!ui.classList.contains('open');closeAllSelects();if(willOpen){ui.classList.add('open');trigger.setAttribute('aria-expanded','true')}};
      trigger.onkeydown=event=>{if(event.key==='ArrowDown'||event.key==='Enter'||event.key===' '){event.preventDefault();if(!ui.classList.contains('open'))trigger.click();(menu.querySelector('[aria-selected=true]')||menu.querySelector('.selectOption'))?.focus()}if(event.key==='Escape')closeSelect(ui)};
      menu.onkeydown=event=>{const items=[...menu.querySelectorAll('.selectOption')],index=items.indexOf(document.activeElement);if(event.key==='ArrowDown'){event.preventDefault();items[(index+1)%items.length].focus()}if(event.key==='ArrowUp'){event.preventDefault();items[(index-1+items.length)%items.length].focus()}if(event.key==='Enter'||event.key===' '){event.preventDefault();document.activeElement?.classList.contains('selectOption')&&document.activeElement.click()}if(event.key==='Escape'){event.preventDefault();closeSelect(ui);trigger.focus()}};
      select._selectUi={ui,trigger,menu};syncSelect(select)
    }
    function syncSelect(select){if(!select._selectUi)return;const {trigger,menu}=select._selectUi,selected=select.options[select.selectedIndex];trigger.querySelector('span').textContent=selected?.textContent||'';menu.querySelectorAll('.selectOption').forEach(item=>item.setAttribute('aria-selected',String(item.dataset.value===select.value)))}
    function syncSelects(){document.querySelectorAll('select.nativeSelect').forEach(syncSelect)}
    function closeSelect(ui){ui.classList.remove('open');ui.querySelector('.selectTrigger')?.setAttribute('aria-expanded','false')}
    function closeAllSelects(){document.querySelectorAll('.selectUi.open').forEach(closeSelect)}
    document.addEventListener('pointerdown',event=>{if(!event.target.closest('.selectUi'))closeAllSelects()});
    ['source','category','yearMin','yearMax','sort'].forEach(id=>enhanceSelect($(id)));
    $('totalStat').textContent=products.length.toLocaleString();
    function filtered(){const q=$('search').value.trim().toLocaleLowerCase(),source=$('source').value,category=$('category').value,yearMin=+$('yearMin').value,yearMax=+$('yearMax').value,priceMin=+$('priceMin').value,priceMax=+$('priceMax').value,sort=$('sort').value,yearFull=yearMin===2021&&yearMax===2026,priceFull=priceMin===PRICE_MIN&&priceMax===PRICE_MAX;let rows=products.filter(p=>{const year=Number.parseInt(p.month?.slice(0,4)),yearMatch=Number.isFinite(year)?year>=yearMin&&year<=yearMax:yearFull,priceMatch=p.price==null?priceFull:p.price>=priceMin&&p.price<=priceMax;return(!source||p.source===source)&&(!category||p.category===category)&&yearMatch&&priceMatch&&(!q||`${p.name} ${p.event} ${p.id}`.toLocaleLowerCase().includes(q))});const price=p=>p.price==null?Number.MAX_SAFE_INTEGER:p.price,date=p=>p.month||'0000-00';rows.sort((a,b)=>sort==='dateAsc'?date(a).localeCompare(date(b)):sort==='priceAsc'?price(a)-price(b):sort==='priceDesc'?(b.price??-1)-(a.price??-1):sort==='name'?a.name.localeCompare(b.name,'ko'):date(b).localeCompare(date(a)));return rows}
    function card(p,index){return `<article class="card" tabindex="0" role="button" data-index="${index}" aria-label="${esc(p.name)} 상세 보기"><div class="media">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:'<div class="noimage">이미지 없음</div>'}<span class="source">${esc(p.source)}</span></div><div class="info"><div class="category">${esc(p.category)}</div><div class="name">${esc(p.name)}</div><div class="meta"><span class="price">${esc(p.priceText||'가격 미상')}</span><span class="date">${esc(p.month||'일정 미상')}</span></div></div></article>`}
    function activeFilterData(){const items=[];if($('search').value.trim())items.push(['search',`검색: ${$('search').value.trim()}`]);if($('source').value)items.push(['source',`판매처: ${$('source').value}`]);if($('category').value)items.push(['category',`카테고리: ${$('category').value}`]);if($('yearMin').value!=='2021'||$('yearMax').value!=='2026')items.push(['year',`연도: ${$('yearMin').value}–${$('yearMax').value}`]);if(+$('priceMin').value!==PRICE_MIN||+$('priceMax').value!==PRICE_MAX)items.push(['price',`가격: ¥${(+$('priceMin').value).toLocaleString()}–¥${(+$('priceMax').value).toLocaleString()}`]);return items}
    function renderActiveFilters(){const items=activeFilterData(),box=$('activeFilters');box.classList.toggle('visible',items.length>0);box.innerHTML=items.map(([key,label])=>`<span class="filterBadge">${esc(label)}<button type="button" data-clear="${key}" aria-label="${esc(label)} 필터 해제">×</button></span>`).join('');box.querySelectorAll('[data-clear]').forEach(button=>button.onclick=()=>{clearFilter(button.dataset.clear);state.page=1;render()})}
    function clearFilter(key){if(key==='search')$('search').value='';if(key==='source')$('source').value='';if(key==='category')$('category').value='';if(key==='year'){$('yearMin').value='2021';$('yearMax').value='2026'}if(key==='price'){$('priceMin').value=PRICE_MIN;$('priceMax').value=PRICE_MAX}}
    function render(){syncSelects();renderActiveFilters();const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/pageSize));state.page=Math.min(state.page,pages);const start=(state.page-1)*pageSize,slice=rows.slice(start,start+pageSize);$('resultCount').textContent=`검색 결과 ${rows.length.toLocaleString()}개`;$('pageInfo').textContent=`${state.page} / ${pages}`;$('prev').disabled=state.page===1;$('next').disabled=state.page===pages;$('catalog').innerHTML=slice.length?slice.map((p,i)=>card(p,start+i)).join(''):'<div class="empty">조건에 맞는 상품이 없습니다.</div>';$('catalog').querySelectorAll('.card').forEach((el,i)=>{const open=()=>show(rows[start+i]);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
    function show(p){const period=p.start&&p.end?`${p.start} – ${p.end}`:p.start||p.end||'일정 미상',eventRow=p.event?`<b>관련 이벤트</b><span>${esc(p.event)}</span>`:'';$('detailContent').innerHTML=`<div class="detail"><div class="detail-media">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="noimage">이미지 없음</div>'}</div><div class="detail-body"><small>${esc(p.source)} · ${esc(p.category)}</small><h2>${esc(p.name)}</h2><div class="detail-price">${esc(p.priceText||'가격 미상')}</div><div class="facts"><b>판매 기간</b><span>${esc(period)}</span><b>판매 상태</b><span>${esc(p.status||'미상')}</span>${eventRow}</div><div class="modal-actions">${safeUrl(p.url)!=='#'?`<a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">상품 페이지</a>`:''}<button type="button" id="closeDetail">닫기</button></div></div></div>`;$('closeDetail').onclick=()=>detail.close();detail.showModal()}
    function updateRange(kind){const min=$(kind+'Min'),max=$(kind+'Max');if(+min.value>+max.value){if(document.activeElement===min)max.value=min.value;else min.value=max.value}state.page=1;render()}
    ['search','source','category','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{state.page=1;render()}));['yearMin','yearMax'].forEach(id=>$(id).addEventListener('change',()=>updateRange('year')));['priceMin','priceMax'].forEach(id=>$(id).addEventListener('input',()=>updateRange('price')));$('resetFilters').onclick=()=>{['search','source','category'].forEach(id=>$(id).value='');$('yearMin').value='2021';$('yearMax').value='2026';$('priceMin').value=PRICE_MIN;$('priceMax').value=PRICE_MAX;$('sort').value='dateDesc';state.page=1;render()};$('prev').onclick=()=>{state.page--;render()};$('next').onclick=()=>{state.page++;render()};detail.addEventListener('click',e=>{if(e.target===detail)detail.close()});render();
  </script>
</body>
</html>
