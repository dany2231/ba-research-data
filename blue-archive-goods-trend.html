<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>블루 아카이브 굿즈 아틀라스</title><link rel="stylesheet" href="atlas-layout.css"><script src="atlas-events.js"></script><style>
:root{--ink:#12213d;--muted:#647089;--line:#dce4f0;--soft:#f5f8fc;--blue:#347fdb;--coral:#f06d65;--violet:#855cc7;--teal:#25a7a0;--gold:#e9a51b;--slate:#7087a8;--shadow:0 12px 30px rgba(28,54,90,.07)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}.wrap{max-width:1480px;margin:auto;padding:28px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.top h1{margin:0 0 8px;font-size:clamp(30px,3.5vw,49px);letter-spacing:-.04em}.top p{margin:0;color:var(--muted)}.stats{display:flex;gap:9px}.stat{min-width:126px;padding:13px 15px;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px}.stat b{display:block;color:var(--c);font-size:27px}.stat span{font-size:11px;color:var(--muted)}section{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:20px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:15px}.head h2{margin:0;font-size:20px;letter-spacing:-.02em}.head p{margin:5px 0 0;font-size:12px;color:var(--muted)}.legend{display:flex;gap:7px;flex-wrap:wrap}.legend button{font:inherit;font-size:11px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}.legend button.off{opacity:.3}.scroll{overflow-x:auto}.chart{height:355px;min-width:1100px;display:grid;grid-template-columns:38px 1fr;grid-template-rows:1fr 42px}.y{display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding:2px 7px 0 0;color:var(--muted);font-size:10px}.plot{position:relative;display:flex;gap:8px;align-items:flex-end;border-left:1px solid #bcc8d8;border-bottom:1px solid #bcc8d8;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(25% - 1px),#e6edf6 calc(25% - 1px),#e6edf6 25%)}.col{height:100%;flex:1;min-width:30px;display:flex;align-items:flex-end;position:relative;z-index:1}.bar{width:100%;height:100%;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}.seg{width:100%}.total{position:absolute;width:100%;text-align:center;font-size:10px;font-weight:800}.x{grid-column:2;display:flex;gap:8px}.x span{flex:1;min-width:30px;text-align:center;color:var(--muted);font-size:9px;padding-top:7px;line-height:1.25}.mark{position:absolute;top:0;bottom:0;border-left:1px dashed #aab7ca;pointer-events:none;z-index:3}.mark b{position:absolute;left:3px;white-space:nowrap;background:rgba(255,255,255,.94);font-size:9px;padding:2px 4px;box-shadow:0 0 0 1px rgba(220,228,240,.7)}.mark.event-fes{border-color:#f06d65}.mark.event-fes b{color:#d95750}.mark.event-live{border-color:#25a7a0}.mark.event-live b{color:#168b86}.mark.event-anime{border-color:#855cc7}.mark.event-anime b{color:#7047b8}.mark.event-story{border-color:#3877c8}.mark.event-story b{color:#2864ae}.mark.event-game{border-color:#db8c27}.mark.event-game b{color:#bd7115}.switch{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 14px;padding:11px 12px;background:var(--soft);border-radius:10px}.switch strong{font-size:12px;margin-right:3px}.switch button{font:inherit;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}.switch button.on{color:#fff;background:var(--ink);border-color:var(--ink)}.download{font:inherit;font-size:12px;font-weight:700;color:#fff;background:var(--ink);border:0;border-radius:9px;padding:9px 13px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compRow{display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:10px;margin:11px 0;font-size:12px}.track{height:16px;background:#eef3f9;border-radius:4px;overflow:hidden}.fill{height:100%;border-radius:4px}.num{text-align:right;font-weight:700}.unknown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.unknown div{padding:14px;background:var(--soft);border-radius:9px}.unknown b{display:block;font-size:22px}.unknown span{font-size:11px;color:var(--muted)}.tip{position:fixed;z-index:10;opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:9px 11px;border-radius:8px;font-size:11px;line-height:1.5;max-width:280px;transform:translate(10px,-110%)}footer{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:14px}@media(max-width:950px){.top{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1;min-width:0}.grid{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:18px 14px}.stats{display:grid;grid-template-columns:repeat(2,1fr)}section{padding:15px}.head{flex-direction:column}.compRow{grid-template-columns:125px 1fr 65px}.unknown{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div><h1>블루 아카이브 굿즈 아틀라스</h1><p>Yostar와 Animate 상품의 카테고리별 판매 등록 흐름</p></div><div class="stats"><div class="stat" style="--c:var(--blue)"><b id="goodsCount">0</b><span>피규어 제외 굿즈</span></div><div class="stat" style="--c:var(--teal)"><b id="datedCount">0</b><span>시계열 집계</span></div><div class="stat" style="--c:var(--coral)"><b id="unknownCount">0</b><span>집계 제외</span></div></div></header>
<section><div class="head"><div><h2 id="chartTitle">분기별 카테고리 출시 추이</h2><p>연월이 확인된 일반 굿즈 기준, 피규어와 연월 미확인 상품 제외</p></div><div class="legend" id="legend"></div><button class="download" id="download">그래프 PNG 다운로드</button></div><div class="switch"><strong>표시 단위</strong><button data-period="quarter" class="on">분기별</button><button data-period="month">월별</button></div><div class="switch"><strong>이벤트 표시</strong><button data-event="anniversary" class="on">주년과 반주년</button><button data-event="anime">애니와 미디어</button><button data-event="fes">블루아카 페스</button><button data-event="live">공개 생방송</button><button data-event="story">메인 스토리</button><button data-event="game">대형 게임 이벤트</button></div><div class="scroll"><div class="chart" id="chart"><div class="y" id="y"></div><div class="plot" id="plot"></div><div class="x" id="x"></div></div></div></section>
<div class="grid"><section style="grid-column:1/-1"><div class="head"><div><h2>카테고리 구성</h2><p>피규어 제외 전체 굿즈 기준</p></div></div><div id="composition"></div></section></div><footer><span>사용자 제공 카탈로그 데이터만 사용</span><span>집계 단위: 판매처별 상품 행</span></footer></main><div class="tip" id="tip"></div><script src="catalog-data.js"></script><script>
const cats=['캔 배지와 아크릴','문구와 책상용품','의류와 액세서리','태피스트리와 포스터','미디어와 서적','생활과 식음과 가젯','브로마이드와 인테리어','기타'];
const colors=['#347fdb','#855cc7','#e15f91','#e9a51b','#25a7a0','#76a640','#7087a8','#a6b2c3'];
function catIndex(name){if(name==='캔 배지 아크릴 제품')return 0;if(name==='문구・책상용품')return 1;if(name==='의류 액세서리'||name==='수건 손수건')return 2;if(name==='태피스트리 포스터')return 3;if(name==='영상, 음악, 미디어'||name==='서적 · 일러스트 모음')return 4;if(['주방용품・칼집','가젯','음식/음료'].includes(name))return 5;if(name==='브로마이드 앨범'||name==='다키마 쿠라 커버 인테리어')return 6;return 7}
const goods=window.CATALOG_PRODUCTS.filter(p=>!p.figure),dated=goods.filter(p=>/^20\d\d-\d\d$/.test(p.month)),unknown=goods.filter(p=>!/^20\d\d-\d\d$/.test(p.month));
goodsCount.textContent=goods.length.toLocaleString();datedCount.textContent=dated.length.toLocaleString();unknownCount.textContent=unknown.length.toLocaleString();
const categoryTotals=cats.map((_,i)=>goods.filter(p=>catIndex(p.category)===i).length),maxCat=Math.max(...categoryTotals);composition.innerHTML=cats.map((c,i)=>`<div class="compRow"><span>${c}</span><div class="track"><div class="fill" style="width:${categoryTotals[i]/maxCat*100}%;background:${colors[i]}"></div></div><span class="num">${categoryTotals[i]}</span></div>`).join('');
const min='2021-01',max='2026-12';let periodMode='quarter',active=new Set(cats.map((_,i)=>i)),activeEvents=new Set(['anniversary']);
const eventGroups=window.ATLAS_EVENTS.monthly;
legend.innerHTML=cats.map((c,i)=>`<button data-cat="${i}"><i style="background:${colors[i]}"></i>${c}</button>`).join('');
function periods(){const a=[];if(periodMode==='month'){for(let y=2021,m=1;y<=2026;){a.push({y,m,label:`${y}.${String(m).padStart(2,'0')}`});m++;if(m===13){m=1;y++}}}else{for(let y=2021;y<=2026;y++)for(let q=1;q<=4;q++)a.push({y,q,label:`${y} Q${q}`})}return a.map(p=>({...p,rows:dated.filter(r=>{const [y,m]=r.month.split('-').map(Number);return y===p.y&&(periodMode==='month'?m===p.m:Math.ceil(m/3)===p.q)})}))}
function render(){const ps=periods(),values=ps.map(p=>cats.map((_,i)=>p.rows.filter(r=>catIndex(r.category)===i).length)),totals=values.map(v=>v.reduce((s,n,i)=>s+(active.has(i)?n:0),0)),top=Math.max(20,Math.ceil(Math.max(...totals)/20)*20);chartTitle.textContent=`${periodMode==='month'?'월별':'분기별'} 카테고리 출시 추이`;y.innerHTML=[top,top*.75,top*.5,top*.25,0].map(v=>`<span>${Math.round(v)}</span>`).join('');plot.innerHTML=ps.map((p,k)=>`<div class="col" data-k="${k}"><span class="total" style="bottom:calc(${totals[k]/top*100}% + 5px)">${totals[k]||''}</span><div class="bar">${values[k].map((v,i)=>active.has(i)&&v?`<div class="seg" style="height:${v/top*100}%;background:${colors[i]}"></div>`:'').join('')}</div></div>`).join('');x.innerHTML=ps.map(p=>`<span>${periodMode==='month'?(p.m===1?p.y+'<br>':'<br>')+p.m+'월':p.y+'<br>Q'+p.q}</span>`).join('');let levels={};activeEvents.forEach(key=>eventGroups[key].items.forEach(item=>{const i=periodMode==='month'?(item[1]-2021)*12+item[2]-1:(item[1]-2021)*4+Math.ceil(item[2]/3)-1;if(i<0||i>=ps.length)return;const level=levels[i]||0;levels[i]=level+1;plot.insertAdjacentHTML('beforeend',`<div class="mark ${eventGroups[key].cls}" style="left:${(i+.5)/ps.length*100}%"><b style="top:${5+level*18}px">${item[0]}</b></div>`)}));document.querySelectorAll('.col').forEach(el=>{el.onmousemove=e=>{const k=+el.dataset.k,p=ps[k];tip.innerHTML=`<b>${p.label} · ${totals[k]}개</b><br>`+cats.map((c,i)=>`${c}: ${values[k][i]}`).join('<br>');tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.style.opacity=1};el.onmouseleave=()=>tip.style.opacity=0})}
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{periodMode=b.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{activeEvents.has(b.dataset.event)?activeEvents.delete(b.dataset.event):activeEvents.add(b.dataset.event);b.classList.toggle('on');render()});legend.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.cat;active.has(i)?active.delete(i):active.add(i);b.classList.toggle('off');render()});
download.onclick=()=>{const ps=periods(),W=periodMode==='month'?3000:1800,H=950,cv=document.createElement('canvas'),c=cv.getContext('2d');cv.width=W;cv.height=H;c.fillStyle='#fff';c.fillRect(0,0,W,H);c.fillStyle='#12213d';c.font='700 40px sans-serif';c.fillText(`${periodMode==='month'?'월별':'분기별'} 굿즈 카테고리 출시 추이`,65,62);const values=ps.map(p=>cats.map((_,i)=>p.rows.filter(r=>catIndex(r.category)===i).length)),totals=values.map(v=>v.reduce((s,n,i)=>s+(active.has(i)?n:0),0)),max=Math.max(20,Math.ceil(Math.max(...totals)/20)*20),L=90,R=40,T=150,B=115,PW=W-L-R,PH=H-T-B,bw=PW/ps.length*.68;for(let i=0;i<=4;i++){const yy=T+PH*i/4;c.strokeStyle='#dce4f0';c.beginPath();c.moveTo(L,yy);c.lineTo(W-R,yy);c.stroke();c.fillStyle='#647089';c.textAlign='right';c.font='14px sans-serif';c.fillText(String(Math.round(max-max*i/4)),L-12,yy+4)}ps.forEach((p,k)=>{let used=0;values[k].forEach((v,i)=>{if(!active.has(i)||!v)return;const h=v/max*PH;c.fillStyle=colors[i];c.fillRect(L+PW*(k+.5)/ps.length-bw/2,T+PH-used-h,bw,h);used+=h});if(totals[k]){c.fillStyle='#12213d';c.textAlign='center';c.font='700 12px sans-serif';c.fillText(totals[k],L+PW*(k+.5)/ps.length,T+PH-used-6)}c.save();c.translate(L+PW*(k+.5)/ps.length,H-48);c.rotate(-Math.PI/3);c.fillStyle='#647089';c.font='12px sans-serif';c.textAlign='right';c.fillText(p.label,0,0);c.restore()});const a=document.createElement('a');a.download=`blue-archive-goods-${periodMode}.png`;a.href=cv.toDataURL('image/png');a.click()};render();
</script><script src="atlas-heatmaps.js"></script></body></html>
